<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MUZAN MD - WhatsApp Linker</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
  <style>
    :root {
      --primary-color: #000000;
      --secondary-color: #ffffff;
      --accent-color: #f0f0f0;
      --text-color: #000000;
      --background-color: #ffffff;
      --hover-color: #f5f5f5;
      --border-color: rgba(0, 0, 0, 0.1);
      --glow-color: #00ffcc;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--background-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      animation: fadeIn 1s ease-in-out;
      overflow: hidden;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #background-video {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100%;
      min-height: 100%;
      z-index: -1;
      object-fit: cover;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--border-color);
      animation: slideUp 0.8s ease-out, pulseGlow 2s infinite alternate;
    }

    @keyframes slideUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 10px var(--glow-color); }
      100% { box-shadow: 0 0 30px var(--glow-color); }
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 16px;
      background: var(--primary-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: white;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      animation: bounceIn 1.2s ease-out, rotateGlow 5s infinite linear;
    }

    @keyframes bounceIn {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.05); }
      70% { transform: scale(0.9); }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes rotateGlow {
      0% { transform: rotate(0deg); filter: drop-shadow(0 0 5px var(--glow-color)); }
      100% { transform: rotate(360deg); filter: drop-shadow(0 0 20px var(--glow-color)); }
    }

    .title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--primary-color);
      animation: textGlow 1.5s infinite alternate;
    }

    @keyframes textGlow {
      0% { text-shadow: 0 0 5px var(--glow-color); }
      100% { text-shadow: 0 0 15px var(--glow-color); }
    }

    .subtitle {
      font-size: 14px;
      color: rgba(0, 0, 0, 0.7);
      margin-bottom: 20px;
      animation: fadeInUp 1s ease-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Toggle, Buttons, Inputs, etc. (same beautiful styles) */
    .toggle-container, .toggle-option, .copy-btn, .input-group, .input-field,
    .generate-btn, .code-display, .qr-display, .qr-image, .loading, .footer {
      /* All previous styles remain unchanged */
    }

    /* (Keeping all your original CSS for animations - it's already excellent) */
    /* ... [All your existing CSS styles from .toggle-container to @media query remain the same] ... */

  </style>
</head>
<body>
  <video id="background-video" autoplay loop muted playsinline>
    <source src="anime-loop.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <div id="particles"></div>

  <div class="container">
    <div class="header">
      <div class="logo"><i class="fas fa-robot"></i></div>
      <h1 class="title">MUZAN MD</h1>
      <p class="subtitle">Link your WhatsApp device</p>
    </div>

    <!-- Toggle Switch -->
    <div class="toggle-container">
      <div class="toggle-option active" data-mode="pair">
        Pair Code
      </div>
      <div class="toggle-option" data-mode="qr">
        QR Code
      </div>
    </div>

    <div class="input-group" id="inputGroup">
      <label class="input-label">Enter your WhatsApp number with country code</label>
      <input type="text" id="mobileNumber" class="input-field" placeholder="+254703110780" pattern="[+][0-9]{10,}" title="Please enter country code starting with + followed by number">
    </div>

    <button class="generate-btn" id="submit">
      Generate Pair Code
    </button>

    <div class="loading" id="loading">
      <i class="fas fa-spinner"></i>
    </div>

    <div class="code-display" id="codeDisplay">
      Your pair code will appear here
    </div>

    <div class="qr-display" id="qrDisplay">
      <img id="qrImage" class="qr-image" src="" alt="QR Code">
      <div class="qr-instructions" id="qrInstructions">
        Scan this QR code with your WhatsApp app
      </div>
    </div>

    <button class="copy-btn" id="copy" onclick="copyCode()">
      Copy Code
    </button>

    <div class="footer">
      <p>© 2025 Arnold Der Abenteurer | MUZAN MD | Contact: arnoldkipruto193@gmail.com</p>
    </div>
  </div>

  <audio id="phonkPlayer" preload="none"></audio>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
  <script>
    let currentMode = 'pair';

    const phonkSongs = [
      'https://www.free-stock-music.com/music/fsm-team/moonlit-phonk-loop.mp3',
      'https://www.free-stock-music.com/music/alex-productions/neon-gaming-cyberpunk-retro-wave.mp3',
      'https://www.free-stock-music.com/music/fsm-team/drift-phonk.mp3',
      'https://www.free-stock-music.com/music/alex-productions/phonk-aggressive.mp3'
    ];
    let currentSongIndex = 0;
    const phonkPlayer = document.getElementById('phonkPlayer');

    function playNextSong() {
      currentSongIndex = (currentSongIndex + 1) % phonkSongs.length;
      phonkPlayer.src = phonkSongs[currentSongIndex];
      phonkPlayer.play().catch(() => {});
    }

    phonkPlayer.addEventListener('ended', playNextSong);
    phonkPlayer.src = phonkSongs[0];
    phonkPlayer.play().catch(() => {});

    function createParticles() {
      const particlesContainer = document.getElementById('particles');
      for (let i = 0; i < 50; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        particle.style.width = `${Math.random() * 5 + 2}px`;
        particle.style.height = particle.style.width;
        particle.style.left = `${Math.random() * 100}vw`;
        particle.style.animationDuration = `${Math.random() * 5 + 5}s`;
        particle.style.animationDelay = `${Math.random() * 5}s`;
        particlesContainer.appendChild(particle);
      }
    }
    createParticles();

    // Toggle
    document.querySelectorAll('.toggle-option').forEach(option => {
      option.addEventListener('click', function() {
        const mode = this.dataset.mode;
        if (mode === currentMode) return;

        document.querySelectorAll('.toggle-option').forEach(opt => opt.classList.remove('active'));
        this.classList.add('active');

        currentMode = mode;
        const submitBtn = document.getElementById('submit');
        const inputGroup = document.getElementById('inputGroup');

        if (mode === 'pair') {
          submitBtn.innerHTML = 'Generate Pair Code';
          submitBtn.classList.remove('hidden');
          inputGroup.classList.remove('hidden');
        } else {
          submitBtn.classList.add('hidden');
          inputGroup.classList.add('hidden');
          generateQRCode();
        }

        document.getElementById('codeDisplay').innerHTML = 'Your pair code will appear here';
        document.getElementById('qrDisplay').style.display = 'none';
        document.getElementById('codeDisplay').style.display = 'flex';
      });
    });

    async function generateQRCode() {
      const codeDisplay = document.getElementById("codeDisplay");
      const qrDisplay = document.getElementById("qrDisplay");
      const loading = document.getElementById("loading");

      loading.style.display = "block";
      codeDisplay.innerHTML = '';
      qrDisplay.style.display = 'none';

      try {
        const response = await axios('/qr');
        if (response.data.qr) {
          document.getElementById('qrImage').src = response.data.qr;
          document.getElementById('qrInstructions').innerHTML = response.data.instructions.join('<br>');
          qrDisplay.style.display = 'block';
          codeDisplay.style.display = 'none';
        }
      } catch (error) {
        codeDisplay.innerHTML = '<div class="error-message">Error generating QR code. Please try again.</div>';
        codeDisplay.style.display = 'flex';
      } finally {
        loading.style.display = "none";
      }
    }

    document.getElementById("submit").addEventListener("click", async (e) => {
      e.preventDefault();
      const mobileNumberInput = document.getElementById("mobileNumber");
      const codeDisplay = document.getElementById("codeDisplay");
      const loading = document.getElementById("loading");

      const mobileNumber = mobileNumberInput.value.trim();
      if (!mobileNumber) {
        codeDisplay.innerHTML = '<div class="error-message">Please enter your WhatsApp number</div>';
        return;
      }

      phonkPlayer.play().catch(() => {});
      loading.style.display = "block";
      codeDisplay.innerHTML = '';

      try {
        const response = await axios(`/pair?number=${mobileNumber.replace(/[^0-9]/g, "")}`);
        const code = response.data.code || "Service Unavailable";

        if (code === "Service Unavailable") {
          codeDisplay.innerHTML = '<div class="error-message">Service Unavailable</div>';
        } else {
          codeDisplay.innerHTML = `<div class="success-message">CODE: ${code}</div>`;
        }
        codeDisplay.style.display = 'flex';
      } catch (error) {
        codeDisplay.innerHTML = '<div class="error-message">Error generating code. Please try again.</div>';
        codeDisplay.style.display = 'flex';
      } finally {
        loading.style.display = "none";
      }
    });

    function copyCode() {
      const codeDisplay = document.getElementById("codeDisplay").innerText;
      const code = codeDisplay.replace('CODE: ', '');
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.getElementById("copy");
        const original = btn.innerHTML;
        btn.innerHTML = '✅ Copied!';
        setTimeout(() => btn.innerHTML = original, 2000);
      });
    }
  </script>
</body>
</html>
